<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Sample web development certificate placeholder</title>
  <desc id="desc">A decorative sample certificate preview for a web development course, clearly labeled as a placeholder.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#262e22"/><stop offset="1" stop-color="#171c16"/></linearGradient></defs>
  <path fill="url(#bg)" d="M0 0h800v520H0z"/>
  <rect x="67" y="59" width="666" height="402" rx="3" fill="#eeeede"/>
  <path d="M88 80h624v360H88z" fill="none" stroke="#9fbc74"/>
  <path d="M99 91h602v338H99z" fill="none" stroke="#c9d2b9"/>
  <path d="M88 122V80h42m540 0h42v42M88 398v42h42m540 0h42v-42" fill="none" stroke="#6c874c" stroke-width="3"/>
  <rect x="343" y="105" width="114" height="22" rx="11" fill="#dce7cb"/>
  <text x="400" y="120" text-anchor="middle" fill="#5d7049" font-family="Arial, sans-serif" font-size="9" letter-spacing="3">SAMPLE</text>
